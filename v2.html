<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>رُشد — منصة الإدارة التعليمية الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<style>
:root {
  --void:#010108;--abyss:#02020C;--deep:#040410;--dark:#07071A;--surface:#0B0B22;--lift:#10102A;
  --card-bg:rgba(255,255,255,0.055);--card-border:rgba(255,255,255,0.13);--card-glow:rgba(244,185,66,0.18);
  --gold:#F4B942;--gold-b:#FFD060;--gold-pale:#FFE8A8;--gold-ember:#E8940A;--gold-glow:rgba(244,185,66,0.22);--gold-trace:rgba(244,185,66,0.07);
  --teal:#00E5CC;--teal-b:#7FFFF0;--teal-dim:#00B89A;--teal-glow:rgba(0,229,204,0.22);--teal-trace:rgba(0,229,204,0.06);
  --violet:#8855FF;--violet-s:#BB99FF;--coral:#FF4466;--coral-s:#FF7799;--orange:#FF8C42;--green:#00FF99;
  --text:#F0EDE6;--text-b:rgba(240,237,230,0.70);--text-dim:rgba(240,237,230,0.38);--text-ghost:rgba(240,237,230,0.12);
  --font-ar:'Tajawal',sans-serif;--font-en:'Syne',sans-serif;
  --f-display:clamp(4rem,10vw,9rem);--f-hero:clamp(2.8rem,6.5vw,5.5rem);--f-title:clamp(1.9rem,4vw,3.5rem);
  --f-sub:clamp(1.15rem,2.2vw,1.8rem);--f-body:clamp(0.95rem,1.5vw,1.2rem);--f-small:clamp(0.78rem,1.05vw,0.95rem);--f-micro:clamp(0.65rem,0.8vw,0.78rem);
  --g-gold:0 0 24px rgba(244,185,66,0.55),0 0 60px rgba(244,185,66,0.28);
  --g-teal:0 0 24px rgba(0,229,204,0.55),0 0 60px rgba(0,229,204,0.28);
  --g-viol:0 0 24px rgba(136,85,255,0.55),0 0 60px rgba(136,85,255,0.28);
  --glass-bg:rgba(255,255,255,0.055);--glass-b:rgba(255,255,255,0.13);
  --glass-blur:blur(22px) saturate(160%) brightness(1.06);
  --glass-shad:0 8px 44px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.09);
  --ease-out:cubic-bezier(0.16,1,0.3,1);--ease-in:cubic-bezier(0.7,0,0.84,0);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--void);color:var(--text);font-family:var(--font-ar);overflow:hidden;-webkit-font-smoothing:antialiased}
body{cursor:none}
.scene{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;opacity:0;pointer-events:none;background:var(--void);display:flex;align-items:center;justify-content:center;z-index:1;will-change:opacity,transform}
.scene.active{opacity:1;pointer-events:all;z-index:2}
.scene-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.scene-content{position:relative;z-index:10;text-align:center;width:100%;padding:24px 2rem 74px}
.bar{position:fixed;left:0;right:0;height:58px;background:rgba(1,1,8,0.92);backdrop-filter:blur(16px);z-index:90;display:flex;align-items:center;padding:0 2rem}
.bar-top{top:0;border-bottom:1px solid rgba(255,255,255,0.07)}
.bar-bot{bottom:0;border-top:1px solid rgba(255,255,255,0.07)}
.bar-left{display:flex;align-items:center;gap:10px}
.bar-right{margin-right:auto;display:flex;align-items:center;gap:12px;font-family:var(--font-en);font-size:0.75rem;color:var(--text-dim);letter-spacing:0.12em}
.prog-wrap{width:110px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0%;border-radius:2px;box-shadow:0 0 8px var(--teal);transition:width 0.5s}
.bot-center{flex:1;display:flex;justify-content:center;align-items:center;gap:5px}
.bot-right{margin-right:auto;font-family:var(--font-ar);font-size:var(--f-micro);color:var(--text-dim);display:flex;align-items:center;gap:6px}
.bot-left{font-family:var(--font-en);font-size:0.62rem;color:rgba(255,255,255,0.2);display:flex;align-items:center;gap:4px}
.bot-left kbd{border:1px solid rgba(255,255,255,0.15);border-radius:3px;padding:1px 5px}
.nav-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.18);cursor:pointer;transition:all 0.3s var(--ease-out);position:relative}
.nav-dot:hover{background:var(--teal);transform:scale(1.6)}
.nav-dot.active{width:18px;border-radius:10px;background:var(--gold);box-shadow:var(--g-gold)}
.nav-tip{position:absolute;bottom:170%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.88);border:1px solid rgba(244,185,66,0.25);border-radius:7px;padding:3px 9px;font-size:0.62rem;font-family:var(--font-ar);color:var(--text);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s}
.nav-dot:hover .nav-tip{opacity:1}
#trans-overlay{position:fixed;inset:0;background:var(--void);opacity:0;pointer-events:none;z-index:50}
#trans-wipe{position:fixed;inset:0;width:200%;height:100%;background:linear-gradient(110deg,transparent 0%,rgba(244,185,66,0.92) 48%,rgba(0,229,204,0.92) 52%,transparent 100%);transform:translateX(-100%);pointer-events:none;z-index:49}
#cursor-dot{width:5px;height:5px;background:var(--teal);border-radius:50%;position:fixed;z-index:9999;pointer-events:none;mix-blend-mode:screen;box-shadow:var(--g-teal);transform:translate(-50%,-50%)}
#cursor-ring{width:34px;height:34px;border:1.5px solid rgba(0,229,204,0.45);border-radius:50%;position:fixed;z-index:9998;pointer-events:none;transform:translate(-50%,-50%);transition:all 0.3s var(--ease-out)}
body.chover #cursor-dot{background:var(--gold);width:8px;height:8px;box-shadow:var(--g-gold)}
body.chover #cursor-ring{width:54px;height:54px;border-color:var(--gold);background:rgba(244,185,66,0.06)}
.glass{background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-b);border-radius:16px;box-shadow:var(--glass-shad)}
.grad-gold{background:linear-gradient(135deg,var(--gold-pale),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-shimmer{background:linear-gradient(135deg,var(--gold-pale),var(--teal-b),var(--gold));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s ease infinite}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse-ring{0%{transform:translate(-50%,-50%) scale(0.4);opacity:0.8}100%{transform:translate(-50%,-50%) scale(3.5);opacity:0}}
@keyframes breathe{0%,100%{filter:brightness(0.94)}50%{filter:brightness(1.06)}}
@keyframes fall{from{transform:translateY(-80px)}to{transform:translateY(110vh)}}
@keyframes ticker{from{right:-100%}to{right:100%}}
@keyframes spin-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.phone{width:255px;height:510px;border-radius:40px;background:#0a0a1a;border:2px solid rgba(255,255,255,0.14);box-shadow:0 0 0 1px rgba(0,0,0,0.8),0 28px 70px rgba(0,0,0,0.65);position:relative;overflow:hidden;flex-shrink:0}
.phone-notch{width:76px;height:26px;background:#000;border-radius:0 0 16px 16px;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5}
.phone-status{width:100%;height:26px;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-family:var(--font-en);font-size:9.5px;color:rgba(255,255,255,0.7);position:relative;z-index:4}
.phone-screen{width:100%;height:calc(100% - 26px);overflow:hidden;position:relative;background:var(--dark)}
.phone-screen-inner{width:100%;will-change:transform}
@media(max-width:900px){.scene-content{padding:60px 1rem 60px}}
.bar-bot{height:44px;padding:0 1rem;background:rgba(1,1,8,0.78)}
.bot-center{flex:1;justify-content:center}
</style>
</head>
<body>
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<div id="trans-overlay"></div>
<div id="trans-wipe"></div>

<div class="bar bar-bot">
  <div class="bot-center" id="ndots"></div>
  <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-en);font-size:0.62rem;color:rgba(255,255,255,0.4)">
    <span id="ctr">01 / 18</span>
    <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
  </div>
</div>

<main id="pres">
  <section class="scene active" id="sc01" data-i="0"></section>
  <section class="scene"        id="sc02" data-i="1"></section>
  <section class="scene"        id="sc03" data-i="2"></section>
  <section class="scene"        id="sc04" data-i="3"></section>
  <section class="scene"        id="sc05" data-i="4"></section>
  <section class="scene"        id="sc06" data-i="5"></section>
  <section class="scene"        id="sc08" data-i="6"></section>
  <section class="scene"        id="sc10" data-i="7"></section>
  <section class="scene"        id="sc11" data-i="8"></section>
  <section class="scene"        id="sc12" data-i="9"></section>
  <section class="scene"        id="sc13" data-i="10"></section>
  <section class="scene"        id="sc09" data-i="11"></section>
  <section class="scene"        id="sc17" data-i="12"></section>
  <section class="scene"        id="sc07" data-i="13"></section>
  <section class="scene"        id="sc14" data-i="14"></section>
  <section class="scene"        id="sc18" data-i="15"></section>
  <section class="scene"        id="sc15" data-i="16"></section>
  <section class="scene"        id="sc16" data-i="17"></section>
</main>

<script>
gsap.registerPlugin(TextPlugin,CustomEase);
gsap.defaults({ease:'power2.out',duration:0.6});
gsap.config({nullTargetWarn:false});
CustomEase.create('cinematic','M0,0 C0.05,0 0.13,0.08 0.2,0.22 C0.35,0.5 0.45,0.85 0.55,0.95 C0.65,1.05 0.8,1.0 1.0,1.0');
function lerp(a,b,t){return a+(b-a)*t}

const $dot=document.getElementById('cursor-dot');
const $ring=document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;gsap.set($dot,{x:mx,y:my})});
(function animCursor(){requestAnimationFrame(animCursor);rx=lerp(rx,mx,0.1);ry=lerp(ry,my,0.1);gsap.set($ring,{x:rx,y:ry})})();
document.addEventListener('mouseover',e=>{if(e.target.closest('[data-hover]'))document.body.classList.add('chover')});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-hover]'))document.body.classList.remove('chover')});

const HQ=!(/Android|iPhone|iPad/i.test(navigator.userAgent))&&window.innerWidth>=1200&&(navigator.hardwareConcurrency||4)>=4;
const Q={p:HQ?3600:1200,pr:Math.min(devicePixelRatio,HQ?2:1.5)};

const SCENES=[
  {l:'الشرارة الأولى',    n:'ابدأ بصمت. دع المشهد يتكلم.'},
  {l:'فريق رُشد',          n:'أعرّف اللجنة بفريق العمل والمشرف.'},
  {l:'ما هي رُشد؟',        n:'المنصة في مشهد حي واضح ومبهر.'},
  {l:'الفجوة والانكسار',   n:'الأرقام تتكلم. الصمت مؤثر.'},
  {l:'الرؤية والحلول',     n:'من الواقع المكسور إلى الحل المتكامل.'},
  {l:'البوصلة',            n:'اذكر الأهداف الخمسة بالأرقام.'},
  {l:'المخطط الشامل',     n:'اشرح المكونات الأربعة.'},
  {l:'مرصد القيادة',      n:'لوحة التحكم حية.'},
  {l:'المايسترو',          n:'وفّرنا ٣ ساعات أسبوعياً.'},
  {l:'المحفز التفاعلي',   n:'نظام نقاط يزيد الانخراط ٤٠٪.'},
  {l:'الحبل السري',        n:'رحلة الإشعار من المدرسة للمنزل.'},
  {l:'غرفة المحركات',     n:'مرّر على كل تقنية + Gemini AI.'},
  {l:'قاعدة البيانات',     n:'مخطط الجداول والأمان والمزامنة.'},
  {l:'المنهجية',           n:'النموذج التزايدي — خطوة خطوة.'},
  {l:'بوتقة الاختبار',    n:'التحديات حقيقية. الحلول موثّقة.'},
  {l:'التوصيات',          n:'خلاصة التنفيذ وما يُنصح به.'},
  {l:'أفق اللانهاية',     n:'رُشد قابل للتوسع. خارطة الطريق.'},
  {l:'تراكب النجوم',       n:'الشكر للجنة. أنتم جاهزون.'},
];
const TOT=SCENES.length;

const $dots=document.getElementById('ndots');
SCENES.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='nav-dot'+(i===0?' active':'');
  d.dataset.index=i;
  const t=document.createElement('div');t.className='nav-tip';t.textContent=s.l;
  d.appendChild(t);d.addEventListener('click',()=>go(i,'D'));$dots.appendChild(d);
});

function updateHUD(i){
  document.getElementById('ctr').textContent=String(i+1).padStart(2,'0')+' / '+String(TOT).padStart(2,'0');
  gsap.to('#prog',{width:((i/(TOT-1))*100)+'%',duration:0.5,ease:'power2.out'});
  document.querySelectorAll('.nav-dot').forEach((d,j)=>d.classList.toggle('active',j===i));
}

let cur=0,busy=false;
const scEls=Array.from(document.querySelectorAll('.scene'));
const cancels=new Array(TOT).fill(null);

function transA(from,to,mid){const wipe=document.getElementById('trans-wipe');gsap.timeline().to(scEls[from],{opacity:0,x:to>from?-30:30,duration:0.32,ease:'power2.in'}).set(wipe,{x:'-100%',opacity:1}).to(wipe,{x:'0%',duration:0.16,ease:'power3.in'},'<0.08').add(()=>{scEls[from].classList.remove('active');gsap.set(scEls[from],{opacity:0,x:0});mid();scEls[to].classList.add('active');gsap.set(scEls[to],{opacity:0,x:to>from?30:-30})}).to(wipe,{x:'100%',duration:0.22,ease:'power3.out'}).to(scEls[to],{opacity:1,x:0,duration:0.38,ease:'expo.out'},'<0.04').add(()=>{busy=false;anim(to)})}
function transB(from,to,mid){const ov=document.getElementById('trans-overlay');gsap.timeline().to(scEls[from],{keyframes:[{x:-5,duration:0.04},{x:5,duration:0.04},{x:0,duration:0.04}]}).set(ov,{background:'#fff',opacity:0}).to(ov,{opacity:1,duration:0.07}).to(ov,{opacity:0,duration:0.1}).add(()=>{scEls[from].classList.remove('active');gsap.set(scEls[from],{opacity:0});mid();scEls[to].classList.add('active');gsap.set(scEls[to],{opacity:0});gsap.set(ov,{background:'var(--void)'})}).to(scEls[to],{opacity:1,duration:0.38},'+=0.04').add(()=>{busy=false;anim(to)})}
function transC(from,to,mid){gsap.timeline().to(scEls[from],{scale:1.07,opacity:0,filter:'blur(8px)',duration:0.55,ease:'power2.in'}).add(()=>{scEls[from].classList.remove('active');gsap.set(scEls[from],{scale:1,opacity:0,filter:'none'});mid();scEls[to].classList.add('active');gsap.set(scEls[to],{opacity:0,scale:1.14})}).to(scEls[to],{opacity:1,scale:1,duration:0.75,ease:'expo.out'},'+=0.04').add(()=>{busy=false;anim(to)})}
function transD(from,to,mid){const ov=document.getElementById('trans-overlay');const ps=[];for(let i=0;i<20;i++){const p=document.createElement('div');p.style.cssText=`position:fixed;width:${3+Math.random()*5}px;height:${3+Math.random()*5}px;border-radius:50%;pointer-events:none;z-index:48;background:${Math.random()>.5?'var(--gold)':'var(--teal)'};left:${Math.random()*100}vw;top:${Math.random()*100}vh;opacity:0`;document.body.appendChild(p);ps.push(p)}gsap.timeline().to(ps,{opacity:0.9,duration:0.12,stagger:{each:0.02,from:'random'}}).to(ps,{x:()=>gsap.utils.random(-180,180),y:()=>gsap.utils.random(-180,180),opacity:0,scale:0,duration:0.35,ease:'power2.in',stagger:{each:0.012,from:'random'}}).to(ov,{opacity:1,duration:0.22},'<0.08').add(()=>{scEls[from].classList.remove('active');gsap.set(scEls[from],{opacity:0});mid();scEls[to].classList.add('active');gsap.set(scEls[to],{opacity:0});ps.forEach(p=>p.remove())}).to(ov,{opacity:0,duration:0.38}).to(scEls[to],{opacity:1,duration:0.32},'<0.08').add(()=>{busy=false;anim(to)})}

function go(target,force){
  if(busy||target===cur||target<0||target>=TOT)return;
  busy=true;const from=cur;
  function mid(){cancel(from);cur=target;updateHUD(target)}
  const type=force||([3,14].includes(target)?'B':target===16?'C':Math.abs(target-from)>1?'D':'A');
  if(type==='B')transB(from,target,mid);
  else if(type==='C')transC(from,target,mid);
  else if(type==='D')transD(from,target,mid);
  else transA(from,target,mid);
}

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(cur-1);
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else{const n=parseInt(e.key);if(n>=1&&n<=9)go(n-1,'D')}
});
window.addEventListener('wheel',e=>{go(e.deltaY>0?cur+1:cur-1)},{passive:true});

// ══════════════════════════════════════════════════════════════
// SCENE 01 — الشرارة الأولى — OPENING SPARK
// ══════════════════════════════════════════════════════════════
function anim_01(){
  const el=document.getElementById('sc01');
  el.innerHTML=`
<canvas id="c01" class="scene-canvas"></canvas>
<div class="scene-content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:1.5rem">
  <div id="s01-tag" style="opacity:0;font-family:var(--font-en);font-size:var(--f-micro);letter-spacing:0.32em;text-transform:uppercase;color:var(--teal);border:1px solid rgba(0,229,204,0.3);padding:6px 18px;border-radius:100px">مشروع تخرج — ١٤٤٧ هـ · تكنولوجيا المعلومات</div>
  <h1 id="s01-t1" style="opacity:0;font-size:var(--f-display);font-weight:900;line-height:1;letter-spacing:0.1em" class="grad-shimmer">رُشد</h1>
  <div id="s01-t2" style="opacity:0;font-size:var(--f-sub);font-weight:300;color:var(--text-b);letter-spacing:0.12em">منصة الإدارة التعليمية الذكية</div>
  <div id="s01-t3" style="opacity:0;font-family:var(--font-en);font-size:var(--f-micro);letter-spacing:0.25em;text-transform:uppercase;color:var(--text-dim)">Smart School Management Platform</div>
  <div id="s01-line" style="opacity:0;width:0%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);max-width:400px"></div>
</div>
<div id="s01-rings" style="position:absolute;top:50%;left:50%;pointer-events:none;z-index:8"></div>`;
  const canvas=document.getElementById('c01');
  const R=new THREE.WebGLRenderer({canvas,antialias:HQ,alpha:true});
  R.setSize(innerWidth,innerHeight);R.setPixelRatio(Q.pr);R.setClearColor(0x010108,1);
  const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,3000);
  C.position.z=260;
